<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="코 방패 대작전">
    <title>🦖 다이노 포켓몬 코 방패 대작전</title>

    <!-- 홈 화면 아이콘 자동 생성 (PNG Data URL) -->
    <script>
      (function () {
        const canvas = document.createElement('canvas');
        canvas.width = 192;
        canvas.height = 192;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(0, 0, 192, 192);

        ctx.font = '110px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🛡️', 96, 102);

        const dataUrl = canvas.toDataURL('image/png');

        ['apple-touch-icon', 'icon', 'shortcut icon'].forEach((rel) => {
          const link = document.createElement('link');
          link.rel = rel;
          link.sizes = '192x192';
          link.href = dataUrl;
          document.head.appendChild(link);
        });
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- MediaPipe FaceMesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #dcfce7 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .bouncy-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .bouncy-btn:active {
            transform: scale(0.94);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }
        @keyframes pulseDanger {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.75); }
            50% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
        }
        @keyframes pulseShield {
            0%, 100% { box-shadow: 0 0 22px rgba(16, 185, 129, 0.85); }
            50% { box-shadow: 0 0 42px rgba(250, 204, 21, 0.95); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }
        .animate-wobble {
            animation: wobble 0.6s ease-in-out infinite;
        }
        .danger-glow {
            animation: pulseDanger 1.5s infinite;
        }
        .shield-glow {
            animation: pulseShield 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-5">

    <!-- 1. 상단 헤더 -->
    <header class="max-w-6xl w-full mx-auto mb-4">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl px-5 py-3.5 shadow-lg border-4 border-amber-300 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-2xl flex items-center justify-center text-2xl shadow-md border-2 border-white">
                    🦖
                </div>
                <div>
                    <h1 class="font-jua text-2xl sm:text-3xl text-slate-800 tracking-wide">
                        🦖 다이노 포켓몬 코 방패 대작전
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-bold">
                        코까지 마스크를 올리면 공룡 헬멧 변신 & 파트너 진화!
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <button onclick="openDexModal()" class="bouncy-btn bg-sky-500 hover:bg-sky-400 text-white font-jua text-base sm:text-lg px-4 py-2.5 rounded-2xl shadow-md border-2 border-white flex items-center gap-2">
                    <span>📖</span>
                    <span>변신 도감 보기</span>
                </button>
                <button onclick="openParentModal()" class="bouncy-btn bg-slate-200 hover:bg-slate-300 text-slate-700 w-11 h-11 rounded-2xl flex items-center justify-center text-xl shadow-sm" title="보호자 설정" aria-label="보호자 설정">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- 2. 메인 대시보드 콘텐츠 -->
    <main class="max-w-6xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">

        <!-- 좌측 영역 (7컬럼): 실시간 AR 변신 거울 -->
        <section class="lg:col-span-7 flex flex-col">
            <div id="arCardContainer" class="bg-white rounded-3xl p-4 sm:p-5 shadow-xl border-4 border-sky-400 flex-1 flex flex-col justify-between transition-all duration-300">

                <!-- 방어력 게이지 바 -->
                <div class="mb-3">
                    <div class="flex items-center justify-between mb-1.5">
                        <span id="shieldLabelText" class="font-jua text-lg text-rose-600 flex items-center gap-1.5">
                            <span>🛡️</span>
                            <span>코 방패 방어력: 50% (코가 노출됨)</span>
                        </span>
                        <span id="shieldPercentBadge" class="font-jua text-base bg-rose-100 text-rose-700 px-3 py-0.5 rounded-full border border-rose-300">
                            50%
                        </span>
                    </div>
                    <div class="w-full h-5 bg-slate-200 rounded-full overflow-hidden p-1 shadow-inner">
                        <div id="shieldProgressBar" class="h-full w-1/2 bg-gradient-to-r from-rose-500 to-amber-400 rounded-full transition-all duration-300"></div>
                    </div>
                </div>

                <!-- 실시간 상태 안내 배너 -->
                <div id="statusBanner" class="mb-3 bg-rose-100 border-2 border-rose-400 text-rose-800 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 transition-colors duration-300">
                    <div class="flex items-center gap-2.5">
                        <span id="statusBannerIcon" class="text-2xl animate-wobble">⚠️</span>
                        <p id="statusBannerText" class="font-jua text-base sm:text-lg leading-snug">
                            앗! 코 방패가 열렸어요! 코까지 마스크를 올려주세요!
                        </p>
                    </div>
                    <span id="countdownBadge" class="hidden shrink-0 bg-emerald-600 text-white font-jua text-xl px-3.5 py-1 rounded-xl shadow">
                        3초
                    </span>
                </div>

                <!-- 카메라 & AR 캔버스 화면 -->
                <div id="cameraViewport" class="relative w-full aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                    <video id="webcamVideo" playsinline autoplay muted class="hidden"></video>
                    <canvas id="arCanvas" class="w-full h-full object-cover block"></canvas>

                    <!-- 카메라 시작 전 안내 오버레이 -->
                    <div id="cameraStartOverlay" class="absolute inset-0 bg-gradient-to-b from-sky-900/90 to-slate-900/95 flex flex-col items-center justify-center p-6 text-center text-white z-10">
                        <div class="text-6xl sm:text-7xl mb-3 animate-float">🦖🛡️😷</div>
                        <h2 class="font-jua text-2xl sm:text-3xl text-amber-300 mb-2">
                            변신 거울을 켜고 코 방패를 완성하자!
                        </h2>
                        <p class="text-sm sm:text-base text-slate-200 mb-5 max-w-md">
                            카메라가 코까지 마스크를 썼는지 확인해요.<br>
                            3초 동안 무적 방패를 유지하면 공룡알이 자라나요!
                        </p>
                        <div class="flex flex-wrap items-center justify-center gap-3">
                            <button onclick="startCamera()" class="bouncy-btn bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-jua text-lg sm:text-xl px-6 py-3.5 rounded-2xl shadow-xl border-2 border-white flex items-center gap-2">
                                <span>📸</span>
                                <span>변신 카메라 켜기</span>
                            </button>
                            <button onclick="startSimulationMode()" class="bouncy-btn bg-amber-400 hover:bg-amber-300 text-slate-900 font-jua text-base sm:text-lg px-5 py-3.5 rounded-2xl shadow-xl border-2 border-white flex items-center gap-2">
                                <span>🎮</span>
                                <span>카메라 없이 체험하기</span>
                            </button>
                        </div>
                        <p id="cameraErrorMsg" class="text-rose-300 text-xs sm:text-sm mt-3 hidden"></p>
                    </div>
                </div>

                <!-- 헬멧 선택 탭 -->
                <div class="mt-3">
                    <p class="text-xs font-bold text-slate-500 mb-1.5">🪖 변신할 공룡 레인저 헬멧 선택:</p>
                    <div class="grid grid-cols-3 gap-
